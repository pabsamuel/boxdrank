<title>VoxSwap Recording Booth</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
  :root {
    --ground:    #eef1f4;
    --surface:   #ffffff;
    --surface-2: #f6f8fa;
    --ink:       #16202b;
    --ink-2:     #4d6070;
    --ink-3:     #7d8f9d;
    --line:      #d5dee4;
    --line-2:    #e7edf1;
    --steel:     #35566e;
    --rec:       #e03131;
    --rec-deep:  #b11f1f;
    --good:      #14714f;
    --good-bg:   #e3f4ec;
    --warn:      #96600a;
    --warn-bg:   #fbf0dc;
    --bad:       #a72620;
    --bad-bg:    #fbe6e4;
    --hl:        #fde68a;
    --shadow:    0 1px 2px rgba(22,32,43,.06), 0 8px 24px rgba(22,32,43,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10161c; --surface: #18212a; --surface-2: #1e2933;
      --ink: #e6edf2; --ink-2: #a3b4c1; --ink-3: #7b8d9a;
      --line: #2c3a46; --line-2: #232f3a; --steel: #8fb2cc;
      --rec: #f2564f; --rec-deep: #c9372f;
      --good: #5fd3a5; --good-bg: #10352a;
      --warn: #e8b567; --warn-bg: #38290f;
      --bad: #f58a82; --bad-bg: #3a1a17;
      --hl: #6b5415;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.34);
    }
  }
  :root[data-theme="dark"] {
    --ground: #10161c; --surface: #18212a; --surface-2: #1e2933;
    --ink: #e6edf2; --ink-2: #a3b4c1; --ink-3: #7b8d9a;
    --line: #2c3a46; --line-2: #232f3a; --steel: #8fb2cc;
    --rec: #f2564f; --rec-deep: #c9372f;
    --good: #5fd3a5; --good-bg: #10352a;
    --warn: #e8b567; --warn-bg: #38290f;
    --bad: #f58a82; --bad-bg: #3a1a17;
    --hl: #6b5415;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 26px rgba(0,0,0,.34);
  }

  html, body { height: 100%; }
  body {
    background: var(--ground); color: var(--ink);
    font-family: Archivo, system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  .shell { min-height: 100%; display: flex; flex-direction: column; max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 18px 22px; }

  .rail { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .rail-track { flex: 1; height: 6px; border-radius: 3px; background: var(--line-2); overflow: hidden; }
  .rail-fill { height: 100%; width: 0; background: var(--steel); transition: width .3s ease; }
  .rail-count { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-3); white-space: nowrap; }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 20px; flex: 1 0 auto; display: flex; flex-direction: column; }
  .eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--steel); margin: 0 0 8px; }
  h1 { font-size: clamp(22px, 5vw, 27px); font-weight: 700; letter-spacing: -.02em; margin: 0 0 8px; text-wrap: balance; }
  .lede { color: var(--ink-2); margin: 0 0 20px; font-size: 14.5px; max-width: 52ch; }

  .fields { display: grid; gap: 14px; }
  @media (min-width: 480px) { .fields { grid-template-columns: 1fr 1fr; } }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 5px; }
  input, select { width: 100%; padding: 10px 12px; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; }
  input:focus-visible, select:focus-visible, button:focus-visible { outline: 2px solid var(--steel); outline-offset: 2px; }
  .hint { font-size: 13px; color: var(--ink-3); margin: 14px 0 0; }

  /* the line to read, word by word */
  .script { font-family: "Source Serif 4", Georgia, serif; font-size: clamp(21px, 4.6vw, 27px); line-height: 1.45; margin: 0 0 6px; text-wrap: pretty; }
  .w { transition: color .1s ease, background-color .1s ease; border-radius: 3px; padding: 0 2px; }
  .reading .w { color: var(--ink-3); }
  .reading .w.said    { color: var(--good); font-weight: 600; }
  .reading .w.now     { color: var(--ink); background: var(--hl); }
  .reading .w.skipped { color: var(--bad); text-decoration: underline wavy; text-underline-offset: 4px; }

  .sync { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 12.5px; color: var(--ink-3); }
  .booth > small { font-size: 11.5px; color: var(--ink-3); text-align: center; max-width: 44ch; line-height: 1.45; }
  .sync button { font: inherit; font-size: 12.5px; background: none; border: 0; color: var(--steel); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 4px; }
  .coach { min-height: 28px; font-size: 16px; font-weight: 600; text-align: center; }
  .coach.c-done { color: var(--good); font-size: 18px; }
  .direction { font-size: 13px; color: var(--ink-3); margin: 0 0 20px; }
  .direction b { color: var(--ink-2); font-weight: 600; }

  .booth { display: flex; flex-direction: column; align-items: center; gap: 13px; margin-block: auto; padding-block: 8px; }
  .recbtn { font: inherit; font-weight: 600; font-size: 16px; cursor: pointer; color: #fff; background: var(--rec); border: 1px solid var(--rec-deep); border-radius: 999px; padding: 14px 30px; display: inline-flex; align-items: center; gap: 11px; }
  .recbtn:hover { background: var(--rec-deep); }
  .recbtn.live { background: var(--ink); border-color: var(--ink); }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: currentColor; flex: none; }
  .recbtn.live .dot { border-radius: 3px; }
  @media (prefers-reduced-motion: no-preference) { .recbtn.live .dot { animation: pulse 1.1s ease-in-out infinite; } }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .2 } }

  .meter { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 340px; }
  .meter-track { flex: 1; height: 8px; border-radius: 4px; background: var(--line-2); overflow: hidden; position: relative; }
  .meter-fill { height: 100%; width: 0; background: var(--good); }
  .meter-fill.low { background: var(--ink-3); }
  .meter-fill.hot { background: var(--rec); }
  .clock { font-family: "IBM Plex Mono", monospace; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink-2); min-width: 44px; text-align: right; }

  /* live coaching while the take is running */
  .coach.c-ok   { color: var(--good); }
  .coach.c-low  { color: var(--warn); }
  .coach.c-hot  { color: var(--rec); }
  .coach.c-noise{ color: var(--warn); }
  .coach.c-idle { color: var(--ink-3); font-weight: 500; }

  audio { width: 100%; max-width: 380px; height: 36px; }

  .alt { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .altbtn { font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--ink-2); padding: 8px 16px; }
  .altbtn:hover { border-color: var(--ink-3); color: var(--ink); }
  .alt small { font-size: 12px; color: var(--ink-3); text-align: center; max-width: 40ch; }
  input[type=file] { display: none; }

  .probe { font-size: 13px; border-radius: 9px; padding: 10px 12px; margin-top: 16px; border: 1px solid transparent; }
  .probe.ok { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 28%, transparent); color: var(--good); }
  .probe.no { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 28%, transparent); color: var(--warn); }
  .probe b { display: block; margin-bottom: 2px; }

  .verdict { width: 100%; border-radius: 10px; padding: 12px 14px; font-size: 14px; border: 1px solid transparent; }
  .verdict b { display: block; font-size: 14px; margin-bottom: 3px; }
  .verdict ul { margin: 6px 0 0; padding-left: 18px; }
  .verdict li { margin-bottom: 3px; }
  .v-good { background: var(--good-bg); border-color: color-mix(in srgb, var(--good) 30%, transparent); color: var(--good); }
  .v-warn { background: var(--warn-bg); border-color: color-mix(in srgb, var(--warn) 30%, transparent); color: var(--warn); }
  .v-bad  { background: var(--bad-bg);  border-color: color-mix(in srgb, var(--bad) 30%, transparent);  color: var(--bad); }
  .stats { font-family: "IBM Plex Mono", monospace; font-size: 11.5px; color: var(--ink-3); margin-top: 9px; display: flex; flex-wrap: wrap; gap: 3px 14px; font-variant-numeric: tabular-nums; }

  .nav { display: flex; align-items: center; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--line-2); }
  .nav .spacer { flex: 1; }
  button.nav-btn { font: inherit; font-weight: 600; font-size: 15px; cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); padding: 11px 20px; }
  button.nav-btn:hover:not(:disabled) { border-color: var(--ink-3); }
  button.nav-btn:disabled { opacity: .4; cursor: not-allowed; }
  button.nav-btn.go { background: var(--steel); border-color: var(--steel); color: var(--surface); }
  .skip { font-size: 13px; color: var(--ink-3); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-family: inherit; padding: 6px; }
  .skip:hover { color: var(--ink-2); }
  .banked { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

  .checklist { list-style: none; margin: 0 0 18px; padding: 0; }
  .checklist li { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 14.5px; color: var(--ink-2); border-bottom: 1px solid var(--line-2); }
  .checklist li:last-child { border-bottom: 0; }
  .tick { font-family: "IBM Plex Mono", monospace; flex: none; width: 15px; }
  .tick.on { color: var(--good); } .tick.off { color: var(--ink-3); }
  .fine { font-size: 13px; color: var(--ink-3); margin: 16px 0 0; }
</style>

<div class="shell">
  <div class="rail">
    <div class="rail-track"><div class="rail-fill" id="railFill"></div></div>
    <span class="rail-count" id="railCount"></span>
  </div>
  <main class="card" id="stage" aria-live="polite"></main>
  <nav class="nav">
    <button class="nav-btn" id="back" type="button"></button>
    <span class="banked" id="banked"></span>
    <span class="spacer"></span>
    <button class="skip" id="skip" type="button" hidden></button>
    <button class="nav-btn go" id="next" type="button"></button>
  </nav>
</div>

  // ------------------------------------------------------------- analysis
  function percentile(sorted, p) {

    if (st.clipRuns > 0) bad.push(L.vClip(st.clipRuns));
    if (st.level < 0.012) bad.push(L.vQuiet);

    if (soft.length) return { level: "warn", title: L.vWarn, lines: soft };

  function encodeWav(pcm, rate) {
    var n = pcm.length, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf), i;
    var str = function (o, s) { for (var k = 0; k < s.length; k++) v.setUint8(o + k, s.charCodeAt(k)); };
    str(0, "RIFF"); v.setUint32(4, 36 + n * 2, true); str(8, "WAVE");
    str(12, "fmt "); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, rate, true); v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    str(36, "data"); v.setUint32(40, n * 2, true);

  async function toMonoPcm(blob) {

  // ------------------------------------------------- following the reading
  //
  // The pacing guide below could only ever be a guess: it hears loudness, not
  // words, so it drifts the moment someone reads faster or slower than the
  // average it assumes. Real synchronisation needs recognition, which the
  // browser has — and which, unlike the recording, does send audio to the
  // browser vendor's service. That trade is the customer's to make, so the
  // page says so and lets them switch it off.
  var Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  var wantSync = true;

  // Turkish breaks the naive lowercase: "İ".toLowerCase() leaves a combining
  // dot behind, and "I" lowercases to "i" rather than "ı".
  function fold(word) {
    return String(word)
      .replace(/İ/g, "i").replace(/I/g, "ı").replace(/Ş/g, "ş").replace(/Ğ/g, "ğ")
      .replace(/Ü/g, "ü").replace(/Ö/g, "ö").replace(/Ç/g, "ç")
      .toLowerCase()
      .replace(/[.,!?;:"'`´’“”…()\[\]—–-]/g, "")
      .replace(/\u0307/g, "")
      .trim();
  }

  // Walk the words they actually said against the words they were given.
  // A word may be misheard or a filler may appear, so a spoken word that does
  // not match is allowed to match one or two words further on — that is what
  // stops one bad guess from stalling the whole line.
  function align(expected, spoken) {
    var cursor = 0, skipped = [];
    for (var i = 0; i < spoken.length && cursor < expected.length; i++) {
      var said = spoken[i];
      if (!said) continue;
      if (expected[cursor] === said || expected[cursor].indexOf(said) === 0 || said.indexOf(expected[cursor]) === 0) {
        cursor++;
        continue;
      }
      for (var look = 1; look <= 2 && cursor + look < expected.length; look++) {
        if (expected[cursor + look] === said) {
          for (var k = 0; k < look; k++) skipped.push(cursor + k);
          cursor += look + 1;
          break;
        }
      }
    }
    return { cursor: cursor, skipped: skipped };
  }

  function startSync(words, onProgress) {
    if (!Recognition || !wantSync || !words.length) return null;
    var expected = words.map(function (w) { return fold(w.textContent); })
                        .filter(function (x) { return x.length; });
    var recog;
    try { recog = new Recognition(); }
    catch (err) { return null; }

    recog.lang = who.lang === "tr" ? "tr-TR" : "en-US";
    recog.continuous = true;
    recog.interimResults = true;
    recog.maxAlternatives = 1;

    var finals = "", alive = true;
    recog.onresult = function (e) {
      var interim = "";
      for (var i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) finals += e.results[i][0].transcript + " ";

      var spoken = (finals + interim).split(/\s+/).map(fold).filter(Boolean);

    // want it back rather than silently dead.

  }

  // ----------------------------------------------------------- microphone
  async function mic() {
    if (stream) return stream;
    // Browser DSP is tuned for phone calls and hurts a clone: AGC rides the
    // level between takes, noise suppression eats the timbre.
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1 }
    });

  }
  async function checkMic() {
    var L = t();
    if (!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      return { ok: false, why: L.micNo };

    try {
      var s = await navigator.mediaDevices.getUserMedia({ audio: true });
      s.getTracks().forEach(function (x) { x.stop(); });

    } catch (err) {

    }

  function showVerdict(level, title, lines, st) {

  // ------------------------------------------------------------- recording
  async function startRec(id) {
    var L = t(), s;
    try { s = await mic(); }
    catch (err) {

    ui.verdict.hidden = true;
    if (ui.player) ui.player.hidden = true;

    // it is running the pacing guide must not also move the highlight — two
    // sources fighting over the same spans is worse than either alone.
    var words = ui.words || [];
    var synced = false, complete = false;
    ui.sync = startSync(words, function (progress, total) {

      for (var i = 0; i < words.length; i++) {
        words[i].className = "w" +
          (progress.skipped.indexOf(i) >= 0 ? " skipped"
            : i < progress.cursor ? " said"
            : i === progress.cursor ? " now" : "");

      }

    var spokenMs = 0, lastFrame = performance.now();
    var totalWeight = 0, weights = words.map(function (w) {

    ui.clock.textContent = "0.0s";
    tick = setInterval(function () { ui.clock.textContent = ((Date.now() - t0) / 1000).toFixed(1) + "s"; }, 100);

      stage.appendChild(el("h1", null, L.hello));
      stage.appendChild(el("p", "lede", L.lede));
      var f = el("div", "fields");
      [["name", L.name, "text", L.namePh, "name"],
       ["mail", L.mail, "email", "ornek@mail.com", "email"],
       ["order", L.order, "text", "ORD-001", "off"],
       ["lang", L.langLabel, "select", "", "off"]].forEach(function (spec) {
        var box = el("div"), lab = el("label", null, spec[1]);
        lab.setAttribute("for", "f_" + spec[0]);
        box.appendChild(lab);
        var input;
        if (spec[2] === "select") {
          input = el("select");
          [["tr", "Türkçe"], ["en", "English"]].forEach(function (o) {
            var opt = el("option", null, o[1]);
            opt.value = o[0];
            if (who.lang === o[0]) opt.selected = true;
            input.appendChild(opt);
          });
          input.addEventListener("change", function () {
            who.lang = input.value;
            takes = {};                       // the script changed; the takes no longer match it
            render();
          });
        } else {
          input = el("input");
          input.type = spec[2];
          input.placeholder = spec[3];
          input.autocomplete = spec[4];
          input.value = who[spec[0]] || "";
          input.addEventListener("input", function () {
            who[spec[0]] = input.value;
            if (spec[0] !== "mail") delete takes.phrase;   // it names them and the order
            paint();
          });
        }
        input.id = "f_" + spec[0];
        box.appendChild(input);
        f.appendChild(box);
      });
      stage.appendChild(f);
      stage.appendChild(el("p", "hint", L.idHint));

      // Find out now whether this view can record. Discovering it on passage
      // six, after reading five out loud, is the worst possible moment.
      var probe = el("div", "probe");
      probe.hidden = true;
      stage.appendChild(probe);
      checkMic().then(function (r) {
        probe.className = "probe " + (r.ok ? "ok" : "no");
        probe.innerHTML = "";
        probe.appendChild(el("b", null, r.ok ? L.micReady : L.micNo));
        probe.appendChild(el("div", null, r.why));
        probe.hidden = false;
      });

    } else if (step === 1) {
      stage.appendChild(el("p", "eyebrow", L.permission));
      stage.appendChild(el("h1", null, L.sayThis));
      stage.appendChild(el("p", "lede", L.permLede));
      var sp = scriptNode(phraseText());
      ui.script = sp.node; ui.words = sp.words;
      stage.appendChild(sp.node);
      stage.appendChild(el("p", "direction", L.readExactly));
      stage.appendChild(boothBlock("phrase"));

    } else if (step === last) {
      var total = banked(), n = 0, bad = 0;
      Object.keys(takes).forEach(function (k) {
        if (k === "phrase") return;
        if (takes[k].level === "bad") bad++; else n++;
      });
      stage.appendChild(el("p", "eyebrow", L.lastStep));
      stage.appendChild(el("h1", null, L.sendIt));
      stage.appendChild(el("p", "lede", L.sendLede));
      var list = el("ul", "checklist");
      var tail = total >= GOOD_TOTAL_S ? L.ckPlenty : total >= MIN_TOTAL_S ? L.ckEnough : L.ckNeed;
      [[!!who.name && !!who.mail, L.ckName],
       [!!takes.phrase && takes.phrase.level !== "bad", L.ckPhrase(takes.phrase ? takes.phrase.secs.toFixed(1) : null)],
       [total >= MIN_TOTAL_S, L.ckSamples(Math.round(total), n, tail)],
       [bad === 0, bad === 0 ? L.ckClean : L.ckBad(bad)]
      ].forEach(function (it) {
        var li = el("li");
        li.appendChild(el("span", "tick " + (it[0] ? "on" : "off"), it[0] ? "✓" : "—"));
        li.appendChild(el("span", null, it[1]));
        list.appendChild(li);
      });
      stage.appendChild(list);
      var note = el("p", "hint");
      note.id = "buildNote";
      stage.appendChild(note);
      stage.appendChild(el("p", "fine", L.withdraw));

    } else {
      var idx = step - 2, p = passages()[idx], id = "s" + (idx + 1);
      stage.appendChild(el("p", "eyebrow", L.passage + " " + (idx + 1) + " " + L.of + " " + passages().length));
      var sn = scriptNode(p[0].replace("{name}", who.name || "…"));
      ui.script = sn.node; ui.words = sn.words;
      stage.appendChild(sn.node);
      var d = el("p", "direction");
      d.appendChild(document.createTextNode(L.tone));
      d.appendChild(el("b", null, p[1]));
      stage.appendChild(d);
      stage.appendChild(boothBlock(id));
    }
    paint();
  }

  function paint() {
    var L = t(), last = stepCount() - 1, total = banked();
    $("railFill").style.width = ((step / last) * 100) + "%";
    $("railCount").textContent = (step + 1) + " / " + stepCount();
    $("banked").textContent = step > 0 && step < last ? Math.round(total) + " " + L.banked : "";
    $("back").textContent = L.back;
    $("skip").textContent = L.skip;
    $("back").disabled = step === 0 || recording;

    var nextBtn = $("next"), skipBtn = $("skip");
    skipBtn.hidden = true;

    if (step === 0) {
      nextBtn.textContent = L.start;
      nextBtn.disabled = !(who.name.trim() && who.mail.trim());
    } else if (step === 1) {
      nextBtn.textContent = L.next;
      nextBtn.disabled = recording || !takes.phrase || takes.phrase.level === "bad";
    } else if (step === last) {
      nextBtn.textContent = L.build;
      nextBtn.disabled = !(who.name.trim() && who.mail.trim() && takes.phrase &&
                           takes.phrase.level !== "bad" && total >= MIN_TOTAL_S);
      var note = $("buildNote");
      if (note) note.textContent = nextBtn.disabled ? L.buildOff : L.buildOn;
    } else {
      var id = "s" + (step - 1);
      nextBtn.textContent = L.next;
      nextBtn.disabled = recording || !takes[id] || takes[id].level === "bad";
      skipBtn.hidden = recording || (!!takes[id] && takes[id].level !== "bad");
    }
  }

  // ----------------------------------------------------------------- pack
  async function build() {
    var L = t(), btn = $("next");
    btn.disabled = true;
    btn.textContent = L.packing;
    var voiceId = slug(who.name) || "customer", order = who.order.trim() || "ORD-001";
    var zip = new JSZip();

    zip.file("consent/C-1-phrase.wav", takes.phrase.wav);
    zip.file("consent/C-1-signed.md",
      "# Consent — " + order + "\n\nI, " + who.name + ", give VoxSwap permission to create a synthetic copy of my\n" +
      "voice and to use it for the roles agreed in order " + order + ".\n\n" +
      "I understand that I can withdraw this permission at any time, that doing so\n" +
      "destroys the cloned voice and everything made from it, and that files already\n" +
      "delivered to me cannot be recalled.\n\n" +
      "Scope: voice_clone, personal_use\nName:  " + who.name + "\nEmail: " + who.mail +
      "\nDate:  " + todayISO() + "\nSigned in the VoxSwap Recording Booth, and spoken aloud in C-1-phrase.wav.\n");

    var used = [], i = 1;
    for (var k = 1; k <= 12; k++) {
      var tk = takes["s" + k];
      if (!tk || tk.level === "bad") continue;
      var fn = "voices/" + voiceId + "/sample_" + String(i).padStart(2, "0") + ".wav";
      zip.file(fn, tk.wav);
      used.push({ file: fn, seconds: +tk.secs.toFixed(2), quality: tk.level,
                  peak: +tk.stats.peak.toFixed(3), noise_gap_db: +tk.stats.snr.toFixed(1) });
      i++;
    }
    var total = used.reduce(function (a, b) { return a + b.seconds; }, 0);

    zip.file("intake.json", JSON.stringify({
      order_id: order,
      recorded_at: new Date().toISOString().replace(/\.\d+Z$/, "Z"),
      reading_language: who.lang,
      voice: { voice_id: voiceId, person_label: who.name, samples_dir: "voices/" + voiceId, consent_ref: "C-1" },
      consent: {
        consent_ref: "C-1", person_name: who.name, person_email: who.mail, is_self: true,
        signed_at: todayISO(), signature_file: "consent/C-1-signed.md",
        phrase_audio: "consent/C-1-phrase.wav", scope: ["voice_clone", "personal_use"],
        expires_at: "", revoked: false,
        phrase_spoken: phraseText(), phrase_language: who.lang,
        phrase_seconds: +takes.phrase.secs.toFixed(2)
      },
      samples: used,
      total_sample_seconds: +total.toFixed(2),
      audio_format: "PCM WAV, mono, " + RATE + " Hz, 16-bit",
      captured_with: "VoxSwap Recording Booth"
    }, null, 2));

    zip.file("README.txt",
      "VoxSwap recording pack — order " + order + "\n" + "=".repeat(46) + "\n\n" +
      "Recorded by " + who.name + " on " + todayISO() + ".\n" +
      total.toFixed(0) + " seconds of samples across " + used.length + " takes, plus the spoken permission.\n\n" +
      "FOR THE OPERATOR\n" +
      "  1. Unzip into orders/" + order + "/ so you end up with:\n" +
      "       orders/" + order + "/consent/C-1-phrase.wav\n" +
      "       orders/" + order + "/consent/C-1-signed.md\n" +
      "       orders/" + order + "/voices/" + voiceId + "/sample_*.wav\n" +
      "  2. Copy the voice/consent blocks out of intake.json into order.json.\n" +
      "  3. Add the game's audio under assets/ and run:\n" +
      "       python3 -m voxswap validate " + order + "\n\n" +
      "  Play C-1-phrase.wav before building anything. It should say this person's\n" +
      "  name, today's date and this order ID — that check is what makes a stolen\n" +
      "  voice note useless, and only a human can actually do it.\n" +
      "  It was recorded in: " + who.lang + "\n\n" +
      "EVERY TAKE, AS MEASURED\n" +
      used.map(function (u) {
        return "  " + u.file.split("/").pop() + "  " + u.seconds.toFixed(1) + "s  peak " +
          Math.round(u.peak * 100) + "%  noise gap " + u.noise_gap_db + " dB  (" + u.quality + ")";
      }).join("\n") + "\n");

    var blob = await zip.generateAsync({ type: "blob", compression: "STORE" });
    var filename = "voxswap-" + slug(order) + "-" + voiceId + ".zip";
    var note = $("buildNote");

    if (HOSTED) {
      try {
        var dl = await window.claude.use("downloads");
        if (!dl) throw { code: "unavailable" };
        await dl.save({ filename: filename, data: blob });
        if (note) note.textContent = L.savedAs(filename);
      } catch (err) {
        var code = (err && err.code) || "unavailable";
        if (note) note.textContent = code === "declined" ? L.saveCancel
          : code === "rate_limited" ? L.saveBusy : L.saveNo;
      }
    } else {
      var a = document.createElement("a"), href = URL.createObjectURL(blob);
      a.href = href;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(href); }, 20000);
      if (note) note.textContent = L.savedAs(filename);
    }
    paint();
  }

  // ------------------------------------------------------------------ nav
  $("next").addEventListener("click", function () {
    if (step === stepCount() - 1) { build(); return; }
    step++;
    render();
    window.scrollTo(0, 0);
  });
  $("back").addEventListener("click", function () {
    if (step > 0) { step--; render(); window.scrollTo(0, 0); }
  });
  $("skip").addEventListener("click", function () { step++; render(); window.scrollTo(0, 0); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !recording && document.activeElement.tagName !== "BUTTON" && !$("next").disabled) {
      $("next").click();
    }
  });

  render();
})();
</script>
