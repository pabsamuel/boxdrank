[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "voxswap"
version = "0.1.0"
description = "Put a customer's own voice into the games and films they already own."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["voice-cloning", "dubbing", "game-modding", "tts", "localization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "License :: OSI Approved :: MIT License",
]

# The core runs on a stock Python install. That is deliberate — see
# DECISIONS.md #1. Everything below is optional.
dependencies = []

[project.optional-dependencies]
# Translation through the Claude API.
translation = ["anthropic>=0.40"]

[project.scripts]
voxswap = "voxswap.cli:main"

[tool.setuptools.packages.find]
include = ["voxswap*"]

[tool.setuptools.package-data]
voxswap = ["../templates/*"]
