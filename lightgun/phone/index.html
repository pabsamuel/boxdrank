<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b0d12">
<title>Light Gun Controller</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<div id="overlay">

  <!-- ---------------------------------------------------------- start -->
  <section id="startScreen" class="screen">
    <h1>LIGHT<span>GUN</span></h1>
    <p class="room">Room <b id="roomCode">----</b></p>
    <div id="caps" class="caps"></div>
    <label class="tvsize">TV size
      <select id="tvSize">
        <option value="24">24" monitor</option>
        <option value="32">32" monitor</option>
        <option value="43">43" TV</option>
        <option value="55" selected>55" TV</option>
        <option value="65">65" TV</option>
        <option value="75">75" TV</option>
        <option value="100">100" projector</option>
      </select>
    </label>
    <button id="startBtn" class="big primary">START GUN</button>
    <button id="startFallbackBtn" class="big ghost">START GUN (gyro mode)</button>
    <p class="hint" id="startHint">Hold the phone like a gun — screen towards you, camera towards the TV.</p>
  </section>

  <!-- ------------------------------------------------------ controller -->
  <section id="gunScreen" class="screen hidden">
    <header id="topBar">
      <span id="stateLabel">CONNECTING</span>
      <span id="trackPill" class="pill">–</span>
    </header>

    <div id="instruction" class="instruction hidden"></div>

    <button id="trigger" class="trigger">
      <span id="triggerLabel">TRIGGER</span>
      <small id="triggerHint">tap anywhere — or flick like a recoil</small>
    </button>

    <footer id="bottomBar">
      <button id="recalBtn" class="chip">RECALIBRATE</button>
      <button id="gestureBtn" class="chip">RECOIL: OFF</button>
      <button id="reloadBtn" class="chip">RELOAD</button>
      <button id="diagBtn" class="chip">DEBUG</button>
      <button id="quitBtn" class="chip">EXIT AR</button>
    </footer>

    <pre id="diag" class="diag hidden"></pre>
  </section>

</div>
<script type="module" src="./js/controller.js"></script>
</body>
</html>
