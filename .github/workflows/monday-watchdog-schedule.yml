# Runs the automation watchdog on a schedule.
#
# Exists because whether monday itself can run a scheduled job is still
# unanswered. A GitHub Actions schedule costs nothing, runs the same runCheck as
# any other host would, and means the product is not blocked on that answer.
# If monday turns out to support scheduling, this becomes the fallback rather
# than the plan.
#
# Disabled by default: it is opt-in via workflow_dispatch until a real token is
# configured, because a scheduled job that fails every morning trains people to
# ignore it.
name: monday watchdog

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 6 * * *'   # 06:00 UTC daily — uncomment once MONDAY_API_TOKEN is set

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monday-automation-watchdog
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci

      # State has to survive between runs or every check looks like the first
      # one and re-announces everything that is already known.
      - name: Restore watchdog state
        uses: actions/cache@v4
        with:
          path: monday-automation-watchdog/.watchdog-state
          key: watchdog-state-${{ github.run_id }}
          restore-keys: watchdog-state-

      # To make this step do anything, add SMTP_URL and WATCHDOG_FROM as repository
      # secrets and reference them below. Until then it exits with "nothing is
      # configured to deliver the alert", which is the intended state.
      #
      # WATCHDOG_DRY_RUN is deliberately NOT set here, and must never be. It would
      # make the step pass by printing the alert body -- board names, the
      # automations being watched, which ones have stopped -- into this workflow
      # log. The repository is public, so that log is world-readable. A failing
      # step that explains itself beats a green one that publishes an account's
      # internal workflow every morning.
      #
      # Only the summary counts are printed, and those carry no account content.
      - name: Run the check
        env:
          MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
          WATCHDOG_RECIPIENT: ${{ secrets.WATCHDOG_RECIPIENT }}
          WATCHDOG_ACCOUNT: default
        run: node scripts/run-check.js
