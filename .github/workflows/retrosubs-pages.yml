name: RetroSubs Web (Pages)

# Publishes the browser version of the retro dialogue box (retrosubs/web) to GitHub Pages,
# so it can be opened on any phone — including iOS, where no overlay API exists.
on:
  push:
    branches: [main]
    paths:
      - 'retrosubs/web/**'
      - '.github/workflows/retrosubs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: retrosubs/web
      - id: deployment
        uses: actions/deploy-pages@v4
