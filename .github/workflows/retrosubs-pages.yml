name: RetroSubs Web (Pages)

# A repository gets one Pages site, so this workflow publishes every browser
# app in the repo rather than just one:
#
#   /                  retrosubs/web   the retro dialogue box
#   /voxswap/          voxswap/web     the VoxSwap recording booth
#   /trendghost/       trendghost/     the viral-trend ghost overlay
#
# RetroSubs keeps the root and its URLs are unchanged. The booth needs a
# top-level HTTPS page for a different reason: browsers refuse a microphone to
# a page inside another site's frame, and never even show the prompt.
on:
  push:
    branches: [main]
    paths:
      - 'retrosubs/web/**'
      - 'voxswap/web/**'
      - 'trendghost/**'
      - '.github/workflows/retrosubs-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trendghost/package-lock.json

      - name: Build TrendGhost
        # The only app here that compiles. Its sub-path has to be baked in at
        # build time — assets, the pose models and the service worker's scope
        # all derive from it — and the ~15 MB of MediaPipe weights are fetched
        # rather than committed.
        run: |
          npm ci
          npm run fetch-models
          npm run build
        working-directory: trendghost
        env:
          BASE_PATH: /boxdrank/trendghost/

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r retrosubs/web/. _site/
          if [ -d voxswap/web ]; then
            mkdir -p _site/voxswap
            # Only the page itself — the folder's README is for contributors.
            cp voxswap/web/*.html _site/voxswap/
          fi
          mkdir -p _site/trendghost
          cp -r trendghost/dist/. _site/trendghost/
          # Pages has no rewrite rules, so a reload inside the app would 404.
          cp trendghost/dist/index.html _site/trendghost/404.html
          # The model files are large and uninteresting; keep the log readable.
          find _site -type f -not -path '_site/trendghost/models/*' | sort

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
