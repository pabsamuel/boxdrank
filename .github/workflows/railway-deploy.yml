name: Deploy to Railway

# Runs on GitHub's runners, which have the outbound network access the
# authoring environment does not. Three modes so the real command surface is
# read from the installed CLI before anything is provisioned:
#
#   probe    — install the CLI and print its help. Changes nothing.
#   deploy   — provision a NEW project (init, Postgres, Redis, api) and deploy.
#              Run it once; running it again creates a second project.
#   redeploy — deploy the current code to the EXISTING project named by
#              RAILWAY_PROJECT_ID below (the one `deploy` created). This is
#              the mode for every deploy after the first.
#
# Database migrations run inside Railway, not from this runner: the Postgres
# service has no public URL, so the runner cannot reach it. railway.json in
# global-emotes/ sets the api service's pre-deploy command to run them before
# each new deployment goes live.
#
# Needs an ACCOUNT/workspace token in the repo secret RAILWAY_API_TOKEN:
# creating a project is account-level work, which a project-scoped
# RAILWAY_TOKEN cannot do. Never set both — the CLI errors if you do.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = read the CLI surface only; deploy = provision and deploy'
        type: choice
        options: [probe, deploy, redeploy]
        default: redeploy

jobs:
  railway:
    runs-on: ubuntu-latest
    env:
      # NEWAPIRAILWAY holds the account-scoped token; the older
      # RAILWAY_API_TOKEN secret is project-scoped and cannot create projects,
      # so it is only a fallback.
      RAILWAY_API_TOKEN: ${{ secrets.NEWAPIRAILWAY || secrets.RAILWAY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Help output needs no auth, so probe runs without a token and the
      # command surface can be read before the owner has added one.
      - name: Check the token is present
        if: inputs.mode != 'probe'
        run: |
          if [ -z "${RAILWAY_API_TOKEN}" ]; then
            echo "::error::No Railway token found. Set the repo secret NEWAPIRAILWAY (or RAILWAY_API_TOKEN) to an account/workspace token from railway.com → Account Settings → Tokens — not a project token."
            exit 1
          fi
          echo "Token present (${#RAILWAY_API_TOKEN} characters)."

      - name: Install the Railway CLI
        run: |
          npm install -g @railway/cli
          railway --version

      - name: Read the CLI surface
        if: inputs.mode == 'probe'
        run: |
          set +e
          for c in "" "init" "add" "variable" "variables" "up" "domain" "service" "link" "status"; do
            echo "═══════════ railway $c --help ═══════════"
            railway $c --help 2>&1 | head -40
          done
          if [ -n "${RAILWAY_API_TOKEN}" ]; then
            echo "═══════════ railway whoami ═══════════"
            railway whoami 2>&1 | head -5
            echo "═══════════ railway list ═══════════"
            railway list 2>&1 | head -20
          else
            echo "(no RAILWAY_API_TOKEN yet — skipping the calls that need auth)"
          fi
          exit 0

      # `whoami` is the one call that separates the two token types: an
      # account/workspace token answers it, a project-scoped one cannot.
      # Checking here turns a bare "Unauthorized" three commands later into a
      # message that says which token to go and make.
      - name: Verify the token is account-scoped
        if: inputs.mode != 'probe'
        run: |
          if ! railway whoami 2>&1 | tee /tmp/whoami.txt; then :; fi
          if grep -qi 'unauthorized' /tmp/whoami.txt; then
            echo "::error::Railway rejected this token for account-level calls, which means it is a PROJECT token (those cannot run whoami, list, or init). Create one at railway.com → Account Settings → Tokens — the account page, not a project's own Settings → Tokens — and replace the NEWAPIRAILWAY secret with it."
            exit 1
          fi

      - name: Provision and deploy
        if: inputs.mode == 'deploy'
        env:
          BRAND_NAME: Global Emotes
          # Optional: set these repo secrets to wire storage and sign-in email.
          # Left empty the API still boots, but uploads and magic-link sign-in
          # will not work until they are supplied.
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
        run: |
          set -euo pipefail
          cd global-emotes

          # Railway builds the Dockerfile at the root of whatever directory is
          # uploaded. Ours lives under infrastructure/docker, and its build
          # context is this directory, so copy it to where the builder looks.
          cp infrastructure/docker/Dockerfile.api ./Dockerfile

          echo "──────── create project ────────"
          railway init --name global-emotes --json

          echo "──────── add Postgres and Redis ────────"
          railway add --database postgres --json
          railway add --database redis --json

          echo "──────── create the api service ────────"
          railway add --service api --json

          # Railway's own variable references use the same ${ { } } form as
          # GitHub expressions, which would be substituted away before the
          # runner ever sees them. Build the opening braces at runtime so the
          # literal reaches Railway intact.
          O='${'
          set_var() {
            railway variable set --service api --skip-deploys "$1" >/dev/null
            echo "  set ${1%%=*}"
          }

          echo "──────── variables ────────"
          set_var "NODE_ENV=production"
          set_var "BRAND_NAME=${BRAND_NAME}"
          set_var "DATABASE_URL=${O}{Postgres.DATABASE_URL}}"
          set_var "REDIS_URL=${O}{Redis.REDIS_URL}}"
          # Generated here and never printed: they exist only inside Railway.
          set_var "SESSION_SECRET=$(openssl rand -base64 36 | tr -d '\n=' | tr '+/' 'Aa')"
          set_var "TOKEN_ENCRYPTION_KEY=$(openssl rand -hex 32)"
          set_var "LOG_LEVEL=info"
          set_var "API_PORT=3001"
          set_var "S3_REGION=auto"
          set_var "S3_BUCKET_ORIGINALS=emote-originals"
          set_var "S3_BUCKET_PROCESSED=emote-processed"
          set_var "S3_BUCKET_QUARANTINE=uploads-quarantine"
          [ -n "${S3_ENDPOINT}" ]         && set_var "S3_ENDPOINT=${S3_ENDPOINT}"             || echo "  (S3_ENDPOINT not supplied — uploads stay unconfigured)"
          [ -n "${S3_ACCESS_KEY_ID}" ]    && set_var "S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID}"   || true
          [ -n "${S3_SECRET_ACCESS_KEY}" ]&& set_var "S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY}" || true
          if [ -n "${SMTP_HOST}" ]; then
            set_var "EMAIL_PROVIDER=smtp"
            set_var "SMTP_HOST=${SMTP_HOST}"
            set_var "SMTP_PORT=465"
            set_var "SMTP_USER=${SMTP_USER}"
            set_var "SMTP_PASS=${SMTP_PASS}"
          else
            echo "  (no SMTP_HOST — sign-in email will not send until it is set)"
          fi

          echo "──────── deploy api ────────"
          railway up --service api --ci

          echo "──────── public domain ────────"
          railway domain --service api --port 3001 --json | tee /tmp/domain.json || true

          echo "──────── project status ────────"
          railway status --json || true

          echo
          echo "Deployed. The API domain is in the 'public domain' output above."
          echo "Migrations have NOT run yet — that is the next step, and it needs"
          echo "the database's public URL, which is read in the step below."

      - name: Redeploy the api service
        if: inputs.mode == 'redeploy'
        run: |
          set -euo pipefail
          cd global-emotes
          cp infrastructure/docker/Dockerfile.api ./Dockerfile

          echo "──────── link the existing project ────────"
          railway link --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT_ID}" --service api --json

          echo "──────── deploy api ────────"
          # railway.json rides along in the upload: Railway runs its
          # preDeployCommand (the migrations) before this deployment goes live.
          railway up --service api --ci

          echo "──────── wait for the health check ────────"
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/health.json -w '%{http_code}' "${API_URL}/v1/health" || echo 000)
            if [ "${code}" = "200" ]; then
              echo "healthy after ~$((i*10))s: $(cat /tmp/health.json)"
              exit 0
            fi
            sleep 10
          done
          echo "::error::${API_URL}/v1/health did not return 200 within 4 minutes (last code ${code}). Check the deployment logs in the Railway dashboard."
          exit 1

      # Only possible when the Postgres service has a public (TCP proxy) URL;
      # DATABASE_URL points at postgres.railway.internal, which the runner
      # cannot resolve. Without a public URL this step passes and leaves the
      # migrations to the api service's pre-deploy command (railway.json).
      - name: Run migrations from the runner (only with a public database URL)
        if: inputs.mode == 'deploy'
        run: |
          set -uo pipefail
          cd global-emotes
          echo "Reading the Postgres public URL..."
          PGURL="$(railway variable list --service Postgres --json 2>/dev/null \
                   | jq -r '.DATABASE_PUBLIC_URL // empty')"
          if [ -z "${PGURL}" ]; then
            echo "::notice::Postgres has no public URL; migrations run inside Railway as the api service's pre-deploy command on its next deployment. Run this workflow in 'redeploy' mode to trigger one."
            exit 0
          fi
          corepack enable
          pnpm install --frozen-lockfile --filter @global-emotes/database...
          DATABASE_URL="${PGURL}" pnpm --filter @global-emotes/database db:migrate
          echo "Migrations applied."
