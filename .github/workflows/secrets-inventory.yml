name: Secrets inventory

# Reports WHICH repo secrets exist, so deploy work can be planned around what
# is actually wired. The authoring environment cannot list secrets (the GitHub
# Actions secrets API is blocked by its proxy), and knowing a name is set is
# the difference between "wire it" and "ask the owner for it".
#
# Only KEYS are ever written anywhere. The secrets object is read into an env
# var and piped straight through `jq keys`, so no value reaches stdout, the
# published log, or an annotation.

on:
  workflow_dispatch:

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: List secret names
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -uo pipefail
          # Never echo "$ALL_SECRETS": it holds every value. Only keys leave jq.
          printf '%s' "${ALL_SECRETS}" | jq -r 'keys[]' | sort > /tmp/names.txt
          echo "Secrets configured on this repo:"
          sed 's/^/  - /' /tmp/names.txt
          echo "::notice title=Secrets present::$(paste -sd', ' /tmp/names.txt)"
