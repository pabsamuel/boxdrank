name: monday-automation-inventory CI

on:
  push:
    paths:
      - 'monday-automation-inventory/**'
      - '.github/workflows/monday-automation-inventory-ci.yml'
  pull_request:
    paths:
      - 'monday-automation-inventory/**'
      - '.github/workflows/monday-automation-inventory-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monday-automation-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # npm ci, not npm install: monday-sdk-js stays on 0.5.x because
      # 1.0.0-beta removed the api() method the board view uses (Watchdog).
      - run: npm ci
      - run: npm test
      # Does what monday code will do on `mapps code:push`: validates
      # .mondaycoderc against the CLI's own schema, builds, and boots the server
      # with no configuration, which is the state of the first deploy.
      - run: npm run check:deploy
