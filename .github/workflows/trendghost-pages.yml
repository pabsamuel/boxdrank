# Publishes TrendGhost to GitHub Pages so it can be opened on a real phone.
# The app needs a secure context for getUserMedia and for the service worker
# that receives shared photos/videos, and Pages gives us HTTPS for free.
#
# Pages serves the site from https://<user>.github.io/<repo>/, so the build runs
# with BASE_PATH set. Every path in the app derives from that base at runtime
# (import.meta.env.BASE_URL in the app, self.location in public/sw.js), so the
# same source also works at "/" for dev, preview and the e2e suite.
name: TrendGhost Pages

on:
  push:
    branches: [main, claude/viral-trends-project-setup-72mp73]
    paths:
      - "trendghost/**"
      - ".github/workflows/trendghost-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancel it.
concurrency:
  group: trendghost-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trendghost/package-lock.json

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Asks GitHub to create the Pages site if it doesn't exist. On many
          # repos the Actions token isn't allowed to, and this step then fails
          # with "Resource not accessible by integration" — in that case an
          # admin sets Settings -> Pages -> Source to "GitHub Actions" once by
          # hand (OWNER_ACTIONS.md) and every run after that works.
          enablement: true

      - name: Install dependencies
        run: npm ci
        working-directory: trendghost

      - name: Fetch pose models
        # ~15 MB of MediaPipe weights, deliberately not committed (DECISIONS.md D11).
        run: npm run fetch-models
        working-directory: trendghost

      - name: Build
        run: npm run build
        working-directory: trendghost
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: SPA fallback
        # Pages has no rewrite rules; without this, a reload on any in-app URL 404s.
        run: cp dist/index.html dist/404.html
        working-directory: trendghost

      - uses: actions/upload-pages-artifact@v3
        with:
          path: trendghost/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
