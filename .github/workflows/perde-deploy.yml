# Deploys Perde to Cloudflare Workers on every push to main that touches perde/.
# Needs two repository secrets (see perde/docs/DEPLOY.md):
#   CLOUDFLARE_API_TOKEN   – token with "Workers Scripts: Edit" (+ Durable Objects)
#   CLOUDFLARE_ACCOUNT_ID  – the account to deploy into
# Optional repository variable ENTITLEMENTS_MODE=lemonsqueezy turns on paid Plus.
name: Perde Deploy

on:
  push:
    branches: [main]
    paths:
      - "perde/**"
      - ".github/workflows/perde-deploy.yml"
  workflow_dispatch:

concurrency:
  group: perde-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: perde

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets
        id: secrets
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] || [ -z "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy. See perde/docs/DEPLOY.md"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          package_json_file: perde/package.json
      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: perde/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.secrets.outputs.configured == 'true'
      - run: pnpm build
        if: steps.secrets.outputs.configured == 'true'
        env:
          VITE_CHECKOUT_URL: ${{ vars.PERDE_CHECKOUT_URL }}
      - name: Deploy worker
        if: steps.secrets.outputs.configured == 'true'
        run: >
          pnpm --filter @perde/relay exec wrangler deploy
          --var ENTITLEMENTS_MODE:${{ vars.ENTITLEMENTS_MODE || 'open' }}
          --var LEMONSQUEEZY_STORE_ID:${{ vars.LEMONSQUEEZY_STORE_ID || '' }}
          --var LEMONSQUEEZY_PRODUCT_ID:${{ vars.LEMONSQUEEZY_PRODUCT_ID || '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
      - name: Smoke test
        if: steps.secrets.outputs.configured == 'true'
        run: |
          url="${{ vars.PERDE_URL }}"
          if [ -n "$url" ]; then
            curl -fsS "$url/api/health" | tee /dev/stderr | grep -q '"ok":true'
          fi
