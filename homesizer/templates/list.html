{% extends "base.html" %}
{% block title %}{{ heading }} — {{ site.name }}{% endblock %}
{% block description %}{{ blurb }}{% endblock %}
{% block content %}
<div class="wrap prose">
  <h1>{{ heading }}</h1>
  <p class="lede">{{ blurb }}</p>
  <ul class="card-list">
    {% for item in items %}
    <li><a class="card" href="{{ item.href }}"><strong>{{ item.title }}</strong><span class="muted">{{ item.blurb }}</span></a></li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
